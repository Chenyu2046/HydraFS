version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tc_fcgi_redis
    networks:
      my_net:
        ipv4_address: 172.30.0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tc_mysql:
    build:
      context: ./mysql
      dockerfile: dockerfile
    container_name: tc_fcgi_mysql
    networks:
      my_net:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_migrate:
    image: mysql:8.0
    container_name: tc_hydrastore_db_migrate
    environment:
      MYSQL_HOST: tc_mysql
      MYSQL_USER: yuncunchu
      MYSQL_DATABASE: yuncunchu
      MYSQL_PWD: 123456
    networks:
      my_net:
        ipv4_address: 172.30.0.10
    volumes:
      - ./mysql/hydra_v2.sql:/migrations/hydra_v2.sql:ro
      - ./mysql/migrate.sh:/migrations/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrations/migrate.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /tmp/hydrastore-v2-migration-ready && test \"$$(mysql -h \"$$MYSQL_HOST\" -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -N -B -e \"SELECT checksum FROM schema_migration WHERE name='hydrastore_v2'\")\" = \"$$(sha256sum /migrations/hydra_v2.sql | awk '{print $$1}')\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      tc_mysql:
        condition: service_healthy

  nginx_fastdfs:
    build:
      context: ..
      dockerfile: docker/nginx_fastdfs/dockerfile
    container_name: tc_fcgi_nginx_fastdfs
    networks:
      my_net:
        ipv4_address: 172.30.0.3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - fastdfs_data:/fastdfs_data_and_log
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:443/ | grep -qE '^[2]'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  fastcgi_app:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/dockerfile
    container_name: tc_fcgi_app
    networks:
      my_net:
        ipv4_address: 172.30.0.4
    restart: unless-stopped
    ports:
      - "10000-10012:10000-10012"
    volumes:
      - ./nginx_fastdfs/client.conf:/etc/fdfs/client.conf
    depends_on:
      tc_mysql:
        condition: service_healthy
      db_migrate:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "lsof", "-i", ":10000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  storage_gateway_1:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/dockerfile
    container_name: tc_hydrastore_gateway_1
    environment:
      STORAGE_GATEWAY_ONLY: "1"
      STORAGE_GATEWAY_WORKERS: "16"
      HYDRA_GATEWAY_INSTANCE: "gateway-1"
      HYDRA_TRACE_LOG: "/app/logs/storage_gateway.trace.log"
    networks:
      my_net:
        ipv4_address: 172.30.0.6
    restart: unless-stopped
    volumes:
      - ./nginx_fastdfs/client.conf:/etc/fdfs/client.conf
    healthcheck:
      test: ["CMD-SHELL", "test \"$(pgrep -fc '[/]app/bin_cgi/storage_gateway')\" -ge 16"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      tc_mysql:
        condition: service_healthy
      db_migrate:
        condition: service_healthy
      redis:
        condition: service_healthy

  storage_gateway_2:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/dockerfile
    container_name: tc_hydrastore_gateway_2
    environment:
      STORAGE_GATEWAY_ONLY: "1"
      STORAGE_GATEWAY_WORKERS: "16"
      HYDRA_GATEWAY_INSTANCE: "gateway-2"
      HYDRA_TRACE_LOG: "/app/logs/storage_gateway.trace.log"
    networks:
      my_net:
        ipv4_address: 172.30.0.7
    restart: unless-stopped
    volumes:
      - ./nginx_fastdfs/client.conf:/etc/fdfs/client.conf
    healthcheck:
      test: ["CMD-SHELL", "test \"$(pgrep -fc '[/]app/bin_cgi/storage_gateway')\" -ge 16"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      tc_mysql:
        condition: service_healthy
      db_migrate:
        condition: service_healthy
      redis:
        condition: service_healthy

  storage_gc_worker:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/dockerfile
    container_name: tc_hydrastore_gc
    environment:
      STORAGE_GC_ONLY: "1"
    networks:
      my_net:
        ipv4_address: 172.30.0.8
    restart: unless-stopped
    volumes:
      - ./nginx_fastdfs/client.conf:/etc/fdfs/client.conf
    depends_on:
      tc_mysql:
        condition: service_healthy
      db_migrate:
        condition: service_healthy
      nginx_fastdfs:
        condition: service_healthy

  fastdfs_storage_2:
    build:
      context: ..
      dockerfile: docker/nginx_fastdfs/dockerfile
    container_name: tc_fastdfs_storage_2
    command: >-
      /bin/bash -c "sed 's/group1/group2/g;s#/storage#/storage2#g'
      /etc/fdfs/storage.conf > /tmp/storage2.conf &&
      mkdir -p /fastdfs_data_and_log/storage2 &&
      fdfs_storaged /tmp/storage2.conf start && tail -f /dev/null"
    networks:
      my_net:
        ipv4_address: 172.30.0.9
    restart: unless-stopped
    volumes:
      - fastdfs_data_2:/fastdfs_data_and_log/storage2
    depends_on:
      nginx_fastdfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "lsof", "-i", ":23000"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  my_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  fastdfs_data:
  mysql_data:
  fastdfs_data_2:
